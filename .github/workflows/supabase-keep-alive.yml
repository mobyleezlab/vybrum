name: Supabase Keep-Alive

on:
  schedule:
    # A cada 3 dias, às 12:00 UTC
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Consulta de leitura no Supabase (SELECT id LIMIT 1)
        env:
          # Fallback opcional: só é usado se o .env do repositório não tiver os valores.
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_SECRET: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          read_env() {
            # Lê uma chave do .env versionado, removendo aspas.
            grep -m1 -E "^$1=" .env 2>/dev/null | cut -d= -f2- | tr -d '"' | tr -d "'" || true
          }

          SUPABASE_URL="$(read_env VITE_SUPABASE_URL)"
          [ -z "$SUPABASE_URL" ] && SUPABASE_URL="$(read_env SUPABASE_URL)"
          [ -z "$SUPABASE_URL" ] && SUPABASE_URL="${SUPABASE_URL_SECRET:-}"

          SUPABASE_ANON_KEY="$(read_env VITE_SUPABASE_PUBLISHABLE_KEY)"
          [ -z "$SUPABASE_ANON_KEY" ] && SUPABASE_ANON_KEY="$(read_env SUPABASE_PUBLISHABLE_KEY)"
          [ -z "$SUPABASE_ANON_KEY" ] && SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY_SECRET:-}"

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Não foi possível obter a URL/chave pública do Supabase (.env ausente e secrets não configurados)."
            exit 1
          fi

          # Nunca imprimimos a chave; apenas mascaramos por segurança.
          echo "::add-mask::$SUPABASE_ANON_KEY"

          ENDPOINT="${SUPABASE_URL%/}/rest/v1/_keep_alive_heartbeat?select=id&limit=1"
          echo "Execução: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Endpoint: ${ENDPOINT}"

          STATUS=$(curl -sS -o /tmp/keepalive.json -w '%{http_code}' \
            --max-time 20 --connect-timeout 10 --retry 2 --retry-delay 5 \
            -X GET "$ENDPOINT" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json")

          echo "HTTP status: ${STATUS}"
          echo "Bytes recebidos: $(wc -c < /tmp/keepalive.json)"

          if [ "${STATUS}" -ge 200 ] && [ "${STATUS}" -lt 300 ]; then
            echo "Keep-alive OK — consulta de leitura executada com sucesso."
          else
            echo "::error::Keep-alive falhou com HTTP ${STATUS}"
            head -c 200 /tmp/keepalive.json || true
            exit 1
          fi
