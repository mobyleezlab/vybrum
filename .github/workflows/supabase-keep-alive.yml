name: Supabase Keep-Alive

on:
  schedule:
    # A cada 3 dias, às 12:00 UTC
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta de leitura no Supabase (SELECT id LIMIT 1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Secrets SUPABASE_URL e/ou SUPABASE_ANON_KEY não configurados."
            exit 1
          fi

          ENDPOINT="${SUPABASE_URL%/}/rest/v1/_keep_alive_heartbeat?select=id&limit=1"
          echo "Execução: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Endpoint: ${SUPABASE_URL%/}/rest/v1/_keep_alive_heartbeat?select=id&limit=1"

          STATUS=$(curl -sS -o /tmp/keepalive.json -w '%{http_code}' \
            --max-time 20 --connect-timeout 10 --retry 2 --retry-delay 5 \
            -X GET "$ENDPOINT" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json")

          echo "HTTP status: ${STATUS}"
          echo "Bytes recebidos: $(wc -c < /tmp/keepalive.json)"

          if [ "${STATUS}" -ge 200 ] && [ "${STATUS}" -lt 300 ]; then
            echo "Keep-alive OK — consulta de leitura executada com sucesso."
          else
            echo "::error::Keep-alive falhou com HTTP ${STATUS}"
            head -c 200 /tmp/keepalive.json || true
            exit 1
          fi
